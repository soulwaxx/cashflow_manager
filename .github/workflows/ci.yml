name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must follow Conventional Commits."
            echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "Example: feat(auth): add OIDC token refresh"
            exit 1
          fi

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
        working-directory: backend

      - name: Run tests with coverage
        run: python -m pytest --cov --cov-report=term-missing
        working-directory: backend

      - name: Verify fresh schema matches ORM metadata
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          config_path="$tmpdir/alembic.ini"
          db_path="$tmpdir/schema.db"
          cp backend/alembic.ini "$config_path"
          export config_path db_path DB_PATH="$db_path"
          python - <<'PY'
          import configparser
          import os

          parser = configparser.ConfigParser()
          parser.read(os.environ["config_path"])
          backend_dir = os.path.abspath("backend")
          parser.set("alembic", "script_location", os.path.join(backend_dir, "alembic"))
          parser.set("alembic", "prepend_sys_path", backend_dir)
          with open(os.environ["config_path"], "w") as config_file:
              parser.write(config_file)
          PY
          (
            cd backend
            alembic -c "$config_path" upgrade head
            alembic -c "$config_path" check
          )

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: frontend

      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

      - name: Run tests with coverage
        run: npm test -- --coverage
        working-directory: frontend

  deploy-config:
    name: Validate production deployment configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config --quiet

  image-build:
    name: Build production image (no push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build production image (amd64, for smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: cashflow-manager:ci
          cache-from: type=gha,scope=main-amd64
          cache-to: type=gha,scope=main-amd64,mode=min

      - name: Build production image (arm64, build-only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          platforms: linux/arm64
          provenance: false
          sbom: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=main-arm64
          cache-to: type=gha,scope=main-arm64,mode=min

      - name: Smoke-test image starts
        run: |
          docker run --rm -d --name cashflow-ci \
            -e DEVELOPMENT_MODE=true \
            -e DB_PATH=/app/data/cashflow.db \
            -p 8080:8080 \
            cashflow-manager:ci
          # Wait up to 30s for nginx to answer
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "Image responded after ${i}s"
              docker stop cashflow-ci
              exit 0
            fi
            sleep 1
          done
          echo "Image did not become ready within 30s"
          docker logs cashflow-ci || true
          docker stop cashflow-ci || true
          exit 1
