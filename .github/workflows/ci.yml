name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'deploy/**'
      - '**/*.md'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'deploy/**'
      - '**/*.md'
      - 'CHANGELOG.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Resolve pip cache dir
        id: pip-cache-dir
        run: echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Pip cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pip-cache-dir.outputs.dir }}
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --requirement requirements.txt
        working-directory: backend

      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml --cov-report=term-missing
        working-directory: backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 3

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24.20.0"

      - name: Resolve npm cache dir
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Npm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
        working-directory: frontend

      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

      - name: Run tests with coverage
        run: npm test -- --coverage
        working-directory: frontend

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 3

  image-build:
    name: Build production image (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build production image (amd64, for smoke test)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          tags: cashflow-manager:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build production image (arm64, build-only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          platforms: linux/arm64
          outputs: type=oci,dest=/tmp/cashflow-manager-arm64.oci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image starts
        run: |
          docker run --rm -d --name cashflow-ci \
            -e DEVELOPMENT_MODE=true \
            -e DB_PATH=/app/data/cashflow.db \
            -p 8080:8080 \
            cashflow-manager:ci
          # Wait up to 30s for nginx to answer
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/api/v1/health > /dev/null 2>&1; then
              echo "Image responded after ${i}s"
              docker stop cashflow-ci
              exit 0
            fi
            sleep 1
          done
          echo "Image did not become ready within 30s"
          docker logs cashflow-ci || true
          docker stop cashflow-ci || true
          exit 1
