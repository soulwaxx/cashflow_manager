name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  # Serialize all GHCR mutations, including cleanup, within this repository.
  group: ghcr-mutations-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Release & publish image
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository }}
    permissions:
      contents: write # needed by semantic-release to create tags/releases
      packages: write # needed to push to GHCR
    env:
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      IMAGE: ghcr.io/${{ github.repository_owner }}/cashflow-manager

    steps:
      - name: Checkout (full history for semantic-release)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release candidate
        id: release-candidate
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          NEW_RELEASE_PUBLISHED: ${{ steps.semantic.outputs.new_release_published }}
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$NEW_RELEASE_PUBLISHED" = "true" ]; then
            {
              printf 'version=%s\n' "$NEW_RELEASE_VERSION"
              echo 'candidate=true'
              echo 'is_recovery=false'
              echo 'publish=true'
              echo 'publish_latest=true'
              echo 'tags<<EOF'
              printf '%s:%s\n' "$IMAGE" "$NEW_RELEASE_VERSION"
              printf '%s:latest\n' "$IMAGE"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t tags < <(
            git tag --points-at "$HEAD_SHA" |
              grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$' || true
          )
          if [ "${#tags[@]}" -eq 0 ]; then
            {
              echo 'candidate=false'
              echo 'publish=false'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#tags[@]}" -ne 1 ]; then
            echo "::error::Expected one semantic version tag at ${HEAD_SHA}; found: ${tags[*]}"
            exit 1
          fi

          tag=${tags[0]}
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName' > /dev/null; then
            echo "::error::Semantic version tag ${tag} points at ${HEAD_SHA}, but its GitHub Release is missing."
            exit 1
          fi
          if ! latest_release_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName'); then
            echo '::error::Could not determine the latest GitHub Release.'
            exit 1
          fi

          {
            printf 'version=%s\n' "${tag#v}"
            echo 'candidate=true'
            echo 'is_recovery=true'
            echo 'publish=false'
            echo 'tags<<EOF'
            printf '%s:%s\n' "$IMAGE" "${tag#v}"
            if [ "$tag" = "$latest_release_tag" ]; then
              echo 'publish_latest=true'
              printf '%s:latest\n' "$IMAGE"
            else
              echo 'publish_latest=false'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Inspect recovery image
        id: recovery-image
        if: steps.release-candidate.outputs.is_recovery == 'true'
        env:
          VERSION: ${{ steps.release-candidate.outputs.version }}
          PUBLISH_LATEST: ${{ steps.release-candidate.outputs.publish_latest }}
        run: |
          set -euo pipefail

          is_missing_inspection_error() {
            grep -Eq '(^ERROR: ghcr\.io/[^[:space:]]+:[^[:space:]]+: not found$|content at https://ghcr\.io/v2/[^[:space:]]+/manifests/[^[:space:]]+ not found: not found$|unexpected status from (HEAD|GET) request to .*/manifests/.*: 404 Not Found)' "$1"
          }

          record_inspection_failure() {
            local error_file=$1
            cat "$error_file" >&2
            # Buildx resolves every child manifest for a formatted inspection. A
            # registry 404 therefore confirms a missing parent or child manifest;
            # every other inspection failure is unsafe to repair automatically.
            if is_missing_inspection_error "$error_file"; then
              INSPECTION_STATUS=missing
            else
              INSPECTION_STATUS=error
            fi
            rm -f "$error_file"
          }

          inspect_image() {
            local ref=$1 error_file
            error_file=$(mktemp)
            if ! INSPECTED_MANIFEST=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2> "$error_file"); then
              record_inspection_failure "$error_file"
              return 1
            fi
            rm -f "$error_file"

            error_file=$(mktemp)
            if ! INSPECTED_PARENT=$(docker buildx imagetools inspect "$ref" --raw 2> "$error_file"); then
              record_inspection_failure "$error_file"
              return 1
            fi
            rm -f "$error_file"
          }

          has_required_platforms() {
            jq -e '
              type == "object" and (.manifests | type == "array") and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
            ' <<< "$1" > /dev/null
          }

          parent_digest() {
            printf '%s' "$1" | sha256sum | awk '{print $1}'
          }

          if ! inspect_image "${IMAGE}:${VERSION}"; then
            if [ "$INSPECTION_STATUS" = 'missing' ]; then
              echo "${IMAGE}:${VERSION} has a missing manifest."
              echo 'publish=true' >> "$GITHUB_OUTPUT"
              echo 'retag_latest=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo '::error::Could not confirm whether the registry image is missing or incomplete.'
            exit 1
          fi

          if ! has_required_platforms "$INSPECTED_MANIFEST"; then
            echo "${IMAGE}:${VERSION} is missing a required platform manifest."
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            echo 'retag_latest=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "${IMAGE}:${VERSION} has complete linux/amd64 and linux/arm64 manifests."
          echo 'publish=false' >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH_LATEST" != 'true' ]; then
            echo 'retag_latest=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version_parent_digest=$(parent_digest "$INSPECTED_PARENT")
          if ! inspect_image "${IMAGE}:latest"; then
            if [ "$INSPECTION_STATUS" = 'missing' ]; then
              echo "${IMAGE}:latest is missing; it will be repaired."
              echo 'retag_latest=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo '::error::Could not confirm whether the latest registry image is missing or broken.'
            exit 1
          fi

          latest_parent_digest=$(parent_digest "$INSPECTED_PARENT")
          if ! has_required_platforms "$INSPECTED_MANIFEST" || [ "$latest_parent_digest" != "$version_parent_digest" ]; then
            echo "${IMAGE}:latest is incomplete or does not reference the version manifest; it will be repaired."
            echo 'retag_latest=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "${IMAGE}:latest already references the complete version manifest."
          echo 'retag_latest=false' >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch emulation)
        if: steps.release-candidate.outputs.publish == 'true' || steps.recovery-image.outputs.publish == 'true'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.release-candidate.outputs.publish == 'true' || steps.recovery-image.outputs.publish == 'true' || steps.recovery-image.outputs.retag_latest == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        if: steps.release-candidate.outputs.publish == 'true' || steps.recovery-image.outputs.publish == 'true' || steps.recovery-image.outputs.retag_latest == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair latest image tag
        if: steps.recovery-image.outputs.retag_latest == 'true'
        env:
          VERSION: ${{ steps.release-candidate.outputs.version }}
        run: |
          set -euo pipefail
          # Preserve the version manifest itself rather than wrapping it in a new index.
          docker buildx imagetools create --prefer-index=false --tag "${IMAGE}:latest" "${IMAGE}:${VERSION}"

      - name: Build and push image
        if: steps.release-candidate.outputs.publish == 'true' || steps.recovery-image.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: ${{ steps.release-candidate.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Personal cashflow manager — FastAPI backend + React frontend
            org.opencontainers.image.licenses=MIT
          cache-from: |
            type=gha,scope=main-amd64
            type=gha,scope=main-arm64

      - name: Verify published image platforms
        if: steps.release-candidate.outputs.publish == 'true' || steps.recovery-image.outputs.publish == 'true' || steps.recovery-image.outputs.retag_latest == 'true'
        env:
          VERSION: ${{ steps.release-candidate.outputs.version }}
          PUBLISH_LATEST: ${{ steps.release-candidate.outputs.publish_latest }}
        run: |
          set -euo pipefail

          verify_platforms() {
            local ref=$1 manifest
            manifest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}')
            jq -e '
              type == "object" and (.manifests | type == "array") and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and
              any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")
            ' <<< "$manifest" > /dev/null
          }

          parent_digest() {
            docker buildx imagetools inspect "$1" --raw | sha256sum | awk '{print $1}'
          }

          verify_platforms "${IMAGE}:${VERSION}"
          if [ "$PUBLISH_LATEST" = 'true' ]; then
            verify_platforms "${IMAGE}:latest"
            [ "$(parent_digest "${IMAGE}:${VERSION}")" = "$(parent_digest "${IMAGE}:latest")" ]
          fi
