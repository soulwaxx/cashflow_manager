services:
  app:
    image: ghcr.io/soulwaxx/cashflow-manager:latest
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "80:8080"
    volumes:
      - ./data:/app/data
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
